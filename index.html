
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个AI网站</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #fce7f3);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: white;
      padding: 45px 30px;
      border-radius: 24px;
      box-shadow: 0 12px 35px #00000015;
      max-width: 420px;
      margin: 20px;
    }
    h1 { color: #6d28d9; }
    p { color: #555; line-height: 1.8; }
    button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ 我的第一个AI网站</h1>
    <p>你好！欢迎来到我的网站。</p >
    <p>这是我使用 ChatGPT 学习制作的第一个网页！</p >
    <button onclick="sayHello()">点击认识我</button>
    <p id="message"></p >
  </div>
  <script>
    function sayHello() {
      document.getElementById("message").textContent =
        "🎉 恭喜！你已经成功运行了第一个网页！";
    }
  </script>
</body>
</html>
